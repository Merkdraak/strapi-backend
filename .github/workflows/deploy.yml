name: Deploy to koekje

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: koekje-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.KOEKJE_SSH_HOST }}
          username: ${{ secrets.KOEKJE_SSH_USER }}
          key: ${{ secrets.KOEKJE_SSH_KEY }}
          fingerprint: ${{ secrets.KOEKJE_SSH_FINGERPRINT }}
          command_timeout: 30m
          script: /usr/local/bin/merkdraak-strapi-deploy
