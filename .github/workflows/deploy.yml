name: Deploy to koekje

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: koekje-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        env:
          KOEKJE_SSH_HOST: ${{ secrets.KOEKJE_SSH_HOST }}
          KOEKJE_SSH_USER: ${{ secrets.KOEKJE_SSH_USER }}
          KOEKJE_SSH_KEY: ${{ secrets.KOEKJE_SSH_KEY }}
          KOEKJE_KNOWN_HOSTS: ${{ secrets.KOEKJE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KOEKJE_SSH_HOST"
          test -n "$KOEKJE_SSH_USER"
          test -n "$KOEKJE_SSH_KEY"
          test -n "$KOEKJE_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KOEKJE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$KOEKJE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${KOEKJE_SSH_USER}@${KOEKJE_SSH_HOST}" \
            sudo -n /usr/local/bin/merkdraak-strapi-deploy
